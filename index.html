<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>จองตั๋วบ้านผีสิง - Haunted House</title>
    <style>
        body { background-color: #121212; color: #fff; font-family: sans-serif; text-align: center; padding: 20px; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 12px; border: 1px solid #ff3333; max-width: 400px; margin: auto; }
        h1 { color: #ff3333; }
        input, select, button { width: 100%; padding: 12px; margin: 10px 0; border-radius: 6px; border: none; box-sizing: border-box; }
        input, select { background: #2a2a2a; color: #fff; }
        button { background: #ff3333; color: #fff; font-weight: bold; cursor: pointer; }
        #qrResult { display: none; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>🎟️ จองตั๋วบ้านผีสิง</h1>
        <p>ราคาตั๋วใบละ 120 บาท</p>
        <form id="bookingForm">
            <input type="text" id="name" placeholder="ชื่อ-นามสกุล ผู้จอง" required>
            <input type="date" id="date" required>
            <select id="slot" required>
                <option value="">เลือกรอบเข้าชม</option>
                <option value="18:00 - 19:00">18:00 - 19:00</option>
                <option value="19:00 - 20:00">19:00 - 20:00</option>
                <option value="20:00 - 21:00">20:00 - 21:00</option>
            </select>
            <input type="number" id="quantity" min="1" value="1" placeholder="จำนวนตั๋ว" required>
            <p style="text-align:left; font-size: 14px; color: #aaa;">แนบสลิปโอนเงิน (โอนเข้าบัญชี กฤตธีญาภา จารุสันต์):</p>
            <input type="file" id="slip" accept="image/*" required>
            <button type="submit">ยืนยันและตรวจสอบสลิป</button>
        </form>

        <div id="qrResult">
            <h3 style="color: #4CAF50;">✅ จองตั๋วสำเร็จ!</h3>
            <p>กรุณาบันทึกภาพ QR Code นี้ไว้แสดงหน้าประตู</p>
            <div id="qrcode"></div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script>
        document.getElementById('bookingForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('name', document.getElementById('name').value);
            formData.append('date', document.getElementById('date').value);
            formData.append('slot', document.getElementById('slot').value);
            formData.append('quantity', document.getElementById('quantity').value);
            formData.append('slip', document.getElementById('slip').files[0]);

            alert('กำลังตรวจสอบสลิป กรุณารอสักครู่...');

            try {
                const res = await fetch('/api/verify-slip', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.success) {
                    document.getElementById('bookingForm').style.display = 'none';
                    document.getElementById('qrResult').style.display = 'block';
                    new QRCode(document.getElementById("qrcode"), data.ticketId);
                } else {
                    alert(data.message);
                }
            } catch (err) {
                alert('เกิดข้อผิดพลาดในการส่งข้อมูล');
            }
        });
    </script>
</body>
</html>
